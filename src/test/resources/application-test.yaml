spring:
  datasource:
    url: jdbc:h2:mem:cars-test-db;MODE=MySQL;NON_KEYWORDS=YEAR;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
server:
  port: 8082

application:
    jwt:
      tokenPrefix: "Bearer "
      tokenExpirationAfterDays: 7
      secretKey: asdasdasdasdasd123344asdasdasdasdasasd12321332sadasXYZ0123456789ABCDEF